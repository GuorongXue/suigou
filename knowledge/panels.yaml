# 板材库 v0.2：厚度/面密度/单价；固定方式按板厚分档（随构/21 安装工艺谱系）
# 档位：≤6mm→corner-flat(面板角槽/平面直角件)；10~12mm→shelf-support(层板托平嵌隐形)；≥15mm→t-nut-screw(螺栓四角)；脆性板→gasket-clamp
meta:
  id: panels
  source: market-estimate + 随构/21 安装工艺实拍谱系
  confidence: inferred+verified-mounts
  review: pending
  version: 0.2.0
panels:
  wood:
    name: 多层实木板
    thickness: 18
    kgPerM2: 11
    pricePerM2: 90
    mount: t-nut-screw
    holeDiameter: 7        # M6 螺栓过孔
    mountNote: T型螺母+螺钉四角固定，长孔浮动留胀缩(mat-wood)
  wood-12:
    name: 多层实木板 12mm(平嵌层板)
    thickness: 12
    kgPerM2: 7.5
    pricePerM2: 70
