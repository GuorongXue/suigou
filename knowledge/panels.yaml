    holeDiameter: 0        # 层板托免打孔（自攻仅入托件）
    mountNote: 层板托平嵌隐形固定，受力面大可后装（安装工艺谱系 12mm 档）
  glass:
    name: 钢化玻璃
    thickness: 8
    kgPerM2: 20
    pricePerM2: 120
    mount: gasket-clamp    # 玻璃不打孔：胶垫承托+压条
    holeDiameter: 0
    mountNote: 钢化玻璃+EPDM胶垫四角承托+压条(mat-glass)
  acrylic:
    name: 亚克力板
    thickness: 5
    kgPerM2: 6
    pricePerM2: 150
    mount: gasket-clamp
    holeDiameter: 0
    mountNote: 胶垫承托+压条，留热胀间隙(mat-acrylic)
  pegboard:
    name: 洞洞板(自打孔海洋板)
    thickness: 5
    kgPerM2: 5
    pricePerM2: 60
    mount: corner-flat
    holeDiameter: 5        # 宜家孔制式 Φ5
    mountNote: 平面直角件/垂直角码外挂固定（╤6mm 薄板档）；孔距50边距10宜家制式
  wire-mesh:
    name: 围网(钢丝网片)
    thickness: 2
    kgPerM2: 2
    pricePerM2: 40
    mount: t-nut-screw
    holeDiameter: 7
