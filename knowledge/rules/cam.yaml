# CAM 加工工艺规则包 v0.2（2026-08-05 嘉立创工艺页 xc.jlcfa.com/process 全量采集，source: jlcfa-process-page, confidence: public）
# 定位：连接件 machining 声明 → 工序链与工艺参数的映射；Process Sheet 数据源

material:
  alloy: 6063-T5
  wallThicknessTolerance: GB/T 5237.1-2017 高精级
  weightNote: 标注米重为覆膜重量，发货撕膜重包装后 ±5% 差异

# 下料公差（工艺页实标，替代 v0.1 的单一±0.3）
cutTolerance:
  "L<=1000": ±0.3
  "L>1000": ±0.5

# ---- v0.3 壁厚/外形/孔位公差全表（2026-08-05 工艺页锚点区块采集）----
# 壁厚语义（工艺页图示）：A=翅壁壁厚(商城标注值) B=封闭腔间壁 C=两封闭腔间隔断壁 H=非壁厚尺寸 E=孔位基准尺寸
wallThicknessActual:            # 具体型号实标（A壁厚/B壁厚/H外形）
  "2020":  { A: 1.4±0.15, B: null,      H: 20.0±0.30 }
  "3030A": { A: 1.5±0.15, B: 1.3±0.20,  H: 30.0±0.50 }
  "4040B": { A: 2.4±0.15, B: 2.0±0.25,  H: 40.0±0.50 }
  # 标准依据：GB/T 5237.1-2017 高精级 + GB/T 14846-2014（I类软合金 6063）

wallThicknessTolerance:         # 按公称壁厚区间 × A/B/C 壁类（外接圆≤100mm）；两表推测为高精级/普通级，页面未明示待核
  table1:                       # 第一表（推测高精级）
    "<=1.50":      { A: ±0.15, B: ±0.20, C: ±0.25 }
    "1.50-3.00":   { A: ±0.15, B: ±0.25, C: ±0.30 }
    "3.00-6.00":   { A: ±0.20, B: ±0.40, C: ±0.50 }
    "6.00-10.00":  { A: ±0.25, B: ±0.60, C: ±0.75 }
    "10.00-15.00": { A: ±0.30, B: ±0.80, C: ±1.00 }
  table2:                       # 第二表（推测普通级）
    "<=1.50":      { A: ±0.20, B: ±0.30, C: ±0.35 }
    "1.50-3.00":   { A: ±0.20, B: ±0.40, C: ±0.50 }
    "3.00-6.00":   { A: ±0.30, B: ±0.60, C: ±0.75 }
    "6.00-10.00":  { A: ±0.35, B: ±0.80, C: ±1.00 }
    "10.00-15.00": { A: ±0.40, B: ±1.00, C: ±1.20 }

outlineTolerance:               # 外形尺寸公差（非壁厚尺寸H，按外接圆直径分档）
  circumscribed<=100:
    "H<=10": ±0.25
    "10-25": ±0.30
    "25-50": ±0.50
    "50-100": ±0.70
  circumscribed100-200:
    "H<=10": ±0.30
    "10-25": ±0.40
    "25-50": ±0.60
    "50-100": ±0.90
    "100-150": ±1.10
    "150-200": ±1.30

holePositionTolerance:          # 孔位尺寸公差（H区间 × E区间矩阵，外接圆≤100mm主档）
  circumscribed<=100:
    "H<=10":   { "E<=20": ±0.25, "20-30": ±0.40, "30-40": ±0.50, "40-60": ±0.65, "60-80": ±0.75, "80-100": ±0.85 }
    "H10-25":  { "E<=20": ±0.30, "20-30": ±0.45, "30-40": ±0.55, "40-60": ±0.70, "60-80": ±0.80, "80-100": ±0.90 }
    "H25-50":  { "E<=20": ±0.50, "20-30": ±0.65, "30-40": ±0.75, "40-60": ±0.90, "60-80": ±1.00, "80-100": ±1.10 }
    "H50-100": { "E<=20": ±0.70, "20-30": ±0.85, "30-40": ±0.95, "40-60": ±1.10, "60-80": ±1.20, "80-100": ±1.30 }
  # 外接圆>100~200mm 档整体加严约+0.05~0.2/档并扩展到E≤180，出图需要时再展开


# 加工公差（工艺页实标）
machiningTolerance:
  holeDiameter: H7级
  holePosition: ±0.2      # 孔位位置度 mm
  holeCenterDistance: ±0.2
  depth: ±0.2
  tapPosition: ±0.2
  tapPrecision: 6H级公制内螺纹，通止规全检
  tapPerpendicularity: ≤0.1°
  deburr: 孔口双面去毛刺，沉头面无划伤（嘉立创默认工艺）
  tapFinish: 铝用切削液，孔口倒角C0.5，螺纹底部无积屑

# 端面攻牙全表（型号 → 中心孔/螺纹/标准深度）
tapTable:
  gb-15:        { coreHole: 2.5,  thread: M3,  depth: 8 }
  gb-15-b:      { coreHole: 3.3,  thread: M4,  depth: 10 }
  eu-2020D:     { coreHole: 4.2,  thread: M5,  depth: 12 }
  eu-20-gb-30:  { coreHole: 5.0,  thread: M6,  depth: 15 }
  eu-30-40s8-gb40: { coreHole: 6.8~7, thread: M8, depth: 20 }
  gb-4040-txcq: { coreHole: 8.8,  thread: M10, depth: 24 }
  eu-40s10-45:  { coreHole: 10~10.3, thread: M12, depth: 28 }
  eu-50:        { coreHole: 12,   thread: M14, depth: 36 }

# 沉头孔全表（系列 → Z规格/d/D/H）
counterboreTable:
  eu-1515:      { z: 4,  d: 4.5, D: 8,    H: 5 }
  eu-2020D:     { z: 5,  d: 5.5, D: 9.5,  H: 5.5 }
  eu-20-gb30:   { z: 6,  d: 6.5, D: 11,   H: 6.5 }
  eu-30-40s8:   { z: 8,  d: 9,   D: 14,   H: 8.5 }
  eu-40s10-45-50: { z: 8, d: 9,  D: 14,   H: 8.5, note: 需配合螺纹套 }
  heavy:        { z: 12, d: 13,  D: 20,   H: 12.5 }

# 扳手孔表（系列 → 孔径）
wrenchHoleTable:
  eu-20: 6.5
  eu-30: 8.5
  gb-30: 6.5
  eu-40: 8.5
  gb-40: 8.5
  eu-45: 12.5

# 锚式通孔表（补 40槽10/45 系列）
anchorHoleTable:
  eu-30-40s8:  { G: 19-T+2, H: 11.5, parts: [TPEF-308-0, TPEG-308-90] }
  eu-40s10-45: { G: 27-T+2, H: 17,   parts: [TPHC-4510-0, TPHD-4510-90] }
  # T = 型材槽口壁厚

# 口哨连接件盲孔表（新连接件类型数据，09文档缺口补齐）
whistleBlindHoleTable:
  eu-20: { G: 13, H: 12.5, D: 9,    connector: TPDF-206-D4.5-ZP, bom: [EDLA-S2-M4-L4, TPAA-N-6-M4] }
  eu-30: { G: 16, H: 15,   D: 12.5, connector: TPEH-308-D6.5-ZP, bom: [EDLA-S1-M6-L20, TPAH-N-B-M6] }
  eu-40: { G: 19, H: 19,   D: 18,   connector: TPFN-408-D6.5-ZP-OB, bom: [EDLA-S1-M6-L25, TPAS-N-B-M6] }
  eu-45: { G: 19, H: 19,   D: 18,   connector: TPGR-4010-D9-ZP, bom: [EDLA-S1-M8-L25, TPBB-N-10-M8] }

# 斜切（Phase 0 范围外，数据先入库）
miterCut:
  standard: 45°
  custom: 30°~150°（更高精度走CNC）
  tolerance: { angle: ±0.2°, jointGap: ±0.3, length: ±0.3 }

# 推荐螺钉表（连接件 BOM 校验源）
screwTable:
  eu-3030-z8: { cylinder: EDLA-S1-M8-L40, panHead: EDLG-S1-M8-L20, standard: [DIN 912-1983, ISO7380-1-2011] }
  eu-4040-z8: { cylinder: EDLA-S1-M8-L45, panHead: EDLG-S1-M8-L20 }
  eu-2020-z6: { cylinder: EDLA-S1-M6-L25, panHead: EDLG-S1-M6-L16 }

# 加工朝向（出图必标字段：打孔朝前/朝后；斜切朝上/下/前/后——Process Sheet 预留）
machiningOrientation: [朝上, 朝下, 朝前, 朝后]

# 工艺规则：加工特征 → 工序 + 完整参数
rules:
  - id: cam-001
    feature: end-tap
    process: 切割 → 去毛刺 → 端面攻丝
    params: { thread: M8×1.25, depth: 20, chamfer: C0.5, note: 参数按截面系列查 tapTable }
    ends: per-joint
  - id: cam-002
    feature: through-hole
    process: 切割 → 钻孔 → 去毛刺
    params: { diameter: 11.5, offsetFromEnd: "G=19-T+2", face: 槽面 }
  - id: cam-003
    feature: deburr
    process: 去毛刺
    appliesTo: all
    note: 嘉立创孔口双面去毛刺为默认；整料锐边倒钝仍需在图纸声明
  - id: cam-004
    feature: chamfer
    process: 倒角
    params: { default: 锐边倒钝, optional: R0.5 }
  - id: cam-005
    feature: counterbore
    process: 切割 → 钻孔 → 沉头 → 去毛刺
    params: { d: 9, D: 14, depth: 8.5, note: 按截面系列查 counterboreTable }
  - id: cam-006
    feature: wrench-hole
    process: 切割 → 钻孔 → 去毛刺
    params: { diameter: 8.5, note: 按系列查 wrenchHoleTable }
  - id: cam-007
    feature: blind-hole
    process: 切割 → 钻盲孔 → 去毛刺
    params: { note: 口哨连接件用，按系列查 whistleBlindHoleTable，深度公差±0.2 }

# 工序卡输出格式（Process Sheet，四类制造文件之③）
processSheetColumns: [件号, 截面, 长度, 公差, 数量, 工序链, 加工参数, 加工朝向, 去毛刺, 倒角]
