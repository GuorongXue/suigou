# M5 回归用例：13-需求测试集 原生组 req-001~010（原话一字不改）
# expected = 人工标注要点（评分对照用，禁止用于自动断言以免掩盖问题）
meta:
  id: m5-native
  source: obsidian 13-需求测试集 原生组
  confidence: verified
  review: approved
  version: 1.0.0
cases:
  - id: req-001
    raw: "我想做一个DIY悬挑落地灯，评论给出了方案：2020型材 8mm光轴 锁定件 型材角码 灯杆"
    expected: 悬挑=超纲降级；不编造尺寸；_riskFlags含悬臂；生成底座立柱部分+说明
  - id: req-002
    raw: "想做一个3d打印机架子 拓竹P系列 带线材收纳箱 两层"
    expected: dimensions null(靠假设)；打印机尺寸进_assumptions；振动→斜撑建议；两层
  - id: req-003
    raw: "电茶炉架子 下方放水桶 中间带一层置物空间 放茶叶茶具等 上面是平台 可以是镂空雕塑的板材"
    expected: 尺寸全缺→追问；水+电风险标记；镂空板=非标接口记录；3层
  - id: req-004
    raw: "铝型材电脑桌架子 双层加中间立面洞洞板设计 上方置物展览架 中间放27寸超杀pro的显示器带移动可调节支架 桌子长1.5m进深90cm"
    expected: 宽1500深900正确抽取；跨度1500触发升4040或中柱；洞洞板side；高度追问
  - id: req-005
    raw: "铝型材五斗柜子 5个木制抽屉带把手带导轨 整体高度约1.5米颜色原木风"
    expected: 高1500；抽屉×5=超纲降级记录；不编造宽深；木材接口
  - id: req-006
    raw: "铝型材桌面护眼灯 三段式 75 30 5 cob灯"
    expected: 无单位数字→dimensions null+假设cm进_assumptions+追问；灯具类降级
  - id: req-007
    raw: "门后面放一个鞋架和置物架 整体宽度为20cm 鞋架斜着放 原木色"
    expected: 深(或宽)200极窄；斜放层板=超纲记录；固定方式追问；细高结构风险
  - id: req-008
    raw: "铝型材工具柜带滑轮 整体大小约为 1m*40 高度为90 两个抽屉 一个大的柜子侧开门 侧板带挂架功能"
    expected: 1000×400×900混合单位正确解析；caster全链路(冲击2.5/脚轮M8/斜撑)；抽屉侧开门降级
  - id: req-009
    raw: "铝型材中古感的开放式衣柜 预算1000 高2.4m 深度60.宽1.8米 具有分区功能 上方收纳区 中间短衣区和长衣区 下面两个抽屉和鞋柜"
    expected: 1800×600×2400；预算敏感high；height>2000风险；分区/抽屉降级记录
  - id: req-010
    raw: "45立方极简美学铝型材海洋板亚克力抽屉柜 H,D,W:45CM"
    expected: 450×450×450紧凑表达解析；海洋板=未覆盖材料诚实记录；亚克力接口
