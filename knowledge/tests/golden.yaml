  - { id: t-con-001-a, rule: con-001, input: { joint: corner-90, load: light }, expect: { use: corner-bracket-30, machiningCount: 0 } }
  - { id: t-con-003-a, rule: con-003, input: { joint: corner-90, load: heavy }, expect: { use: anchor-30, machining: [{ type: through-hole, diameter: 11.5 }] } }
